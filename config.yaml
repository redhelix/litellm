model_list:
- model_name: spark-learner
  litellm_params:
    model: openai/spark-learner
    api_base: http://100.115.141.106:8000/v1   # spark-001 Tailscale IP
    api_key: none
    max_tokens: 32768
    timeout: 600
  model_info:
    max_input_tokens: 131072
    max_tokens: 32768
    supports_function_calling: true
    version: v3.0
    notes: "Qwen3.5-35B-A3B MoE, v3.0 re-merged via Unsloth. Served with --tool-call-parser qwen3_coder (NOT hermes). 31/31 cognitive (100%), judge 8.9/10. See github.com/redhelix/spark-training BENCHMARK_V3.md for details."
