search_tools:
- search_tool_name: searxng-search
  litellm_params:
    search_provider: searxng
    api_base: https://searxng.thelaljis.com
- search_tool_name: firecrawl-search
  litellm_params:
    search_provider: firecrawl
    api_key: os.environ/FIRECRAWL_API_KEY
    api_base: https://firecrawl.thelaljis.com/v1
router_settings:
  routing_strategy: latency-based-routing
  fallbacks:
  - spark-learner:
    - spark-nemotron-120B
    - nemotron-cascade-2
    - kimi-k2.5
  - spark-nemotron-120B:
    - spark-learner
    - nemotron-cascade-2
    - kimi-k2.5
  - nemotron-cascade-2:
    - spark-nemotron-120B
    - spark-learner
    - kimi-k2.5
  - kimi-k2.5:
    - gemini-flash
  - gemini-flash:
    - kimi-k2.5
  - gemini-pro:
    - kimi-k2.5
    - gemini-flash
  - minimax-m2.7:
    - gemini-flash
    - kimi-k2.5
  - perplexity-sonar-pro:
    - kimi-k2.5
    - gemini-flash
  - perplexity-sonar:
    - kimi-k2.5
    - gemini-flash
  - honcho-chat:
    - nemotron-cascade-2
    - spark-nemotron-120B
    - kimi-k2.5
  - openai/text-embedding-3-small:
    - nomic-embed-text
  - nomic-embed-text:
    - openai/text-embedding-3-small
  - gpt-4o-mini:
    - gemini-flash
    - kimi-k2.5
  - nano-banana-pro:
    - nano-banana-2
  - nano-banana-2:
    - nano-banana-pro
  num_retries: 5
  retry_after: 5
  timeout: 60
  cooldown_time: 30
  allowed_fails: 25
  enable_pre_call_checks: true
  context_window_fallbacks:
  - spark-learner:
    - kimi-k2.5
    - gemini-flash
  - spark-nemotron-120B:
    - kimi-k2.5
    - gemini-flash
  - nemotron-cascade-2:
    - nemotron-cascade-2-hintonator
    - kimi-k2.5
    - gemini-flash
  - honcho-chat:
    - kimi-k2.5
    - gemini-flash
litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 300
  max_tokens: 16384
  max_budget: 100.0
  budget_duration: 30d
  rate_limit_strategy: auto
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 3600
  cache_models:
  - gemini-flash
  - kimi-k2.5
  - gemini-pro
  - minimax-m2.7
  - gpt-4o-mini
  callbacks:
  - fix_json_tool_calls.proxy_handler_instance
  - prometheus
  # strip_think removed 2026-04-12: no active model benefits.
  # spark-learner: neutral. nemotron-120B: -2 tests. cascade-2: -19 tests.
  # See v3-recovery benchmark matrix for data.
  - weave_callback.proxy_handler_instance
general_settings:
  maximum_spend_logs_retention_period: 30
  master_key: os.environ/LITELLM_MASTER_KEY
  proxy_budget_ratelimiter_max_budget: 100
  proxy_budget_ratelimiter_max_currency: USD
  database_url: os.environ/DATABASE_URL
  database_connection_timeout: 30
  database_connection_pool_limit: 10
  enable_loadbalancing_logging: false
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  prometheus_url: http://192.168.50.117:9090
  alerting:
    budget_alerts: true
    budget_threshold: 0.85
    rate_limit_alerts: true
metrics:
- prometheus
