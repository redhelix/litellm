model_list:
# spark-001 + spark-002: DeepSeek-V4-Flash TP=2 cluster
- model_name: deepseek-v4-flash
  litellm_params:
    model: openai/deepseek-v4-flash
    api_base: http://192.168.50.83:8000/v1
    api_key: none
    cache:
      no-cache: true
    max_tokens: 32768
    timeout: 600
    temperature: 0.6
  model_info:
    max_input_tokens: 500000
    max_tokens: 32768
    supports_function_calling: true
# spark-003: Qwen35-122B hybrid Mamba/attention INT4 (replaced AEON 27B 2026-07-05; bench 90/100)
- model_name: spark-003-qwen3.5-122b
  litellm_params:
    cache:
      no-cache: true
    model: openai/spark-003-qwen3.5-122b
    api_base: http://192.168.50.70:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    temperature: 0.6
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  model_info:
    max_input_tokens: 262144
    max_tokens: 32768
    supports_function_calling: true
# qwen36-27b-* names retained as back-compat aliases; now resolve to Qwen35-122B on :70 (AEON served-name retired)
- model_name: qwen36-27b-xs
  litellm_params:
    cache:
      no-cache: true
    model: openai/spark-003-qwen3.5-122b
    api_base: http://192.168.50.70:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    temperature: 0.8
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  model_info:
    max_input_tokens: 262144
    max_tokens: 32768
    supports_function_calling: true
- model_name: qwen36-fast
  litellm_params:
    cache:
      no-cache: true
    model: openai/spark-003-qwen3.5-122b
    api_base: http://192.168.50.70:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 180
    # Was 0.0. Greedy decoding sent this route into repetition loops in long
    # agentic contexts, and litellm_params override the caller's temperature,
    # so MoA's reference_temperature was being silently ignored.
    temperature: 0.6
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  model_info:
    max_input_tokens: 262144
    max_tokens: 32768
    supports_function_calling: true
- model_name: qwen36-deep
  litellm_params:
    cache:
      no-cache: true
    model: openai/spark-003-qwen3.5-122b
    api_base: http://192.168.50.70:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    # Was 0.0. See qwen36-fast above: greedy decoding caused repetition loops,
    # and this pin overrode the temperature MoA asked for.
    temperature: 0.6
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  model_info:
    max_input_tokens: 262144
    max_tokens: 32768
    supports_function_calling: true
- model_name: qwen36-27b-aeon
  litellm_params:
    cache:
      no-cache: true
    model: openai/spark-003-qwen3.5-122b
    api_base: http://192.168.50.70:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    temperature: 0.8
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  model_info:
    max_input_tokens: 262144
    max_tokens: 32768
    supports_function_calling: true
- model_name: hintonator-qwen3-30b-a3b
  litellm_params:
    cache:
      no-cache: true
    # Backend: hintonator RTX 5090 — unsloth/Qwen3.8-27B-NVFP4 (dense, natively
    # vision-language), served under both qwen3-30b-a3b and qwen3.8-27b so this
    # route kept resolving across the swap. Reports max_model_len 81920.
    model: openai/qwen3-30b-a3b
    api_base: http://192.168.50.73:8000/v1
    api_key: none
    max_tokens: 8192
    timeout: 600
  model_info:
    # 73728 + 8192 = 81920, matching the backend's --max-model-len exactly, so
    # input plus output can never exceed the context window. Keep this in
    # lockstep with --max-model-len in vllm/hintonator: too high produces vLLM
    # 400 "max_tokens cannot be greater than max_model_len", too low silently
    # caps clients below the real window.
    max_input_tokens: 73728
    max_tokens: 8192
    supports_function_calling: true
    supports_vision: true
- model_name: nomic-embed-text
  litellm_params:
    model: openai/nomic-embed-text
