- model_name: nemotron-cascade-2
  litellm_params:
    # Backend 1: hintonator RTX 5090 (primary, ~8x faster than docker-gpu)
    # Latency-based routing sends requests here first.
    model: openai/nemotron-cascade-2
    api_base: http://192.168.50.73:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    thinking:
      type: enabled
      budget_tokens: 512
  model_info:
    max_input_tokens: 65536
    max_tokens: 32768
    supports_function_calling: true
- model_name: nemotron-cascade-2
  litellm_params:
    # Backend 2: docker-gpu RTX 3090 (overflow)
    # Slower — latency-based routing uses this when hintonator is busy.
    model: openai/nemotron-cascade-2
    api_base: http://docker-gpu.thelaljis.com:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    thinking:
      type: enabled
      budget_tokens: 512
  model_info:
    max_input_tokens: 32768
    max_tokens: 32768
    supports_function_calling: true
- model_name: nemotron-cascade-2-hintonator
  litellm_params:
    # Hintonator-only alias — used as context_window_fallback for nemotron-cascade-2
    # so that requests >32K are retried on hintonator (65K) before falling back to cloud.
    model: openai/nemotron-cascade-2
    api_base: http://192.168.50.73:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    thinking:
      type: enabled
      budget_tokens: 512
  model_info:
    max_input_tokens: 65536
    max_tokens: 32768
    supports_function_calling: true
