router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
  - spark-003-qwen3.5-122b:
      - deepseek-v4-flash
      - kimi-k2.6
      - gemini-flash
  - qwen36-fast:
      - deepseek-v4-flash
      - kimi-k2.6
      - gemini-flash
  - deepseek-v4-flash:
      - qwen36-27b-aeon
      - kimi-k2.6
      - gemini-flash
  - qwen36-27b-aeon:
      - deepseek-v4-flash
      - kimi-k2.6
      - gemini-flash
  - hintonator-qwen3-30b-a3b:
      - qwen36-27b-aeon
      - kimi-k2.6
      - gemini-flash
  - docker-gpu-gemma4-26B:
      - hintonator-qwen3-30b-a3b
      - gemini-flash
      - kimi-k2.6
  - kimi-k2.6:
      - gemini-flash
  - gemini-flash:
      - kimi-k2.6
  - gemini-pro:
      - kimi-k2.6
      - gemini-flash
  - minimax-m2.7:
      - gemini-flash
      - kimi-k2.6
  - openai/text-embedding-3-small:
      - nomic-embed-text
  - nomic-embed-text:
      - openai/text-embedding-3-small
  - gpt-4o-mini:
      - gemini-flash
      - kimi-k2.6
  - nano-banana-pro:
      - nano-banana-2
  - nano-banana-2:
      - nano-banana-pro
  num_retries: 5
  retry_after: 5
  timeout: 60
  cooldown_time: 30
  retry_policy:
    ConnectError: 0
    ConnectionError: 0
    ServiceUnavailableError: 0
    TimeoutErrorRetries: 2
  allowed_fails: 25
  context_window_fallbacks:
    - {"hintonator-qwen3-30b-a3b": ["deepseek-v4-flash", "qwen36-27b-aeon", "kimi-k2.6", "gemini-flash"]}
    - {"docker-gpu-gemma4-26B": ["deepseek-v4-flash", "kimi-k2.6", "gemini-flash"]}
    - {"deepseek-v4-flash": ["kimi-k2.6", "gemini-flash"]}
    - {"spark-003-qwen3.5-122b": ["deepseek-v4-flash", "kimi-k2.6", "gemini-flash"]}
    - {"qwen36-27b-aeon": ["kimi-k2.6", "gemini-flash"]}
litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  config_update_interval: 0  # disable DB config polling — DB failures reset context_window_fallbacks to None
  context_window_fallbacks:
    - {"hintonator-qwen3-30b-a3b": ["deepseek-v4-flash", "qwen36-27b-aeon", "kimi-k2.6", "gemini-flash"]}
    - {"docker-gpu-gemma4-26B": ["deepseek-v4-flash", "kimi-k2.6", "gemini-flash"]}
    - {"deepseek-v4-flash": ["kimi-k2.6", "gemini-flash"]}
    - {"spark-003-qwen3.5-122b": ["deepseek-v4-flash", "kimi-k2.6", "gemini-flash"]}
    - {"qwen36-27b-aeon": ["kimi-k2.6", "gemini-flash"]}
  max_tokens: 16384
  max_budget: 100.0
  budget_duration: 30d
  rate_limit_strategy: auto
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 3600
  # NOTE: there is no `cache_models` setting in LiteLLM — a key by that name
  # lived here for a long time and did nothing, so `cache: true` was caching
  # every model. Per-model exclusion is done with `cache: {no-cache: true}` in
  # that model's litellm_params; see the local routes above.
  #
  # Every model that participates in an agent loop (Hermes default, MoA
  # references and aggregator, delegation, auxiliary tasks) is excluded. A cache
  # hit returns the identical completion for an identical request, so an agent
  # that re-sends the same context gets the same tool call back and cannot break
  # out. That is what produced the repeated "you have read this exact file
  # region N times in a row" guard trips.
  callbacks:
  - merge_system_messages.proxy_handler_instance
  - fix_json_tool_calls.proxy_handler_instance
  - prometheus
  # strip_think removed 2026-04-12: no active model benefits.
  # spark-learner: neutral. nemotron-120B: -2 tests. cascade-2: -19 tests.
  # See v3-recovery benchmark matrix for data.
  # weave_callback disabled 2026-04-22: RecursionError in redact_sensitive_keys on large responses (weave 0.52.37 bug) — drops connections for long generations
  # - weave_callback.proxy_handler_instance
general_settings:
  maximum_spend_logs_retention_period: 30
  master_key: os.environ/LITELLM_MASTER_KEY
  proxy_budget_ratelimiter_max_budget: 100
  proxy_budget_ratelimiter_max_currency: USD
  database_url: os.environ/DATABASE_URL
  database_connection_timeout: 30
  database_connection_pool_limit: 10
  enable_loadbalancing_logging: false
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  prometheus_url: http://192.168.50.117:9090
  alerting:
    budget_alerts: true
    budget_threshold: 0.85
    rate_limit_alerts: true
metrics:
- prometheus
