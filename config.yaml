model_list:
# Cluster endpoint: spark-001 (Ray head, pipeline-parallel across spark-001+003)
# spark-003 is now a Ray worker — no standalone API. All traffic via spark-001:8000.
- model_name: qwen36-heretic
  litellm_params:
    model: openai/qwen36-35b-heretic
    api_base: http://192.168.50.83:8000/v1
    api_key: none
    max_tokens: 32768
    timeout: 600
    temperature: 0.8
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  model_info:
    max_input_tokens: 262144
    max_tokens: 32768
    supports_function_calling: true
